# 蒲公英中医 v2.9（旧平台）—— 域名已让给 X1，仅保留 IP 直连入口
# 部署：覆盖服务器 /etc/nginx/conf.d/pgy-v29.conf 后 nginx -t && systemctl reload nginx
# 访问：https://101.132.42.13:8443（证书为 pgytcm.com 域名证书，浏览器会提示名称不匹配，属预期）
server {
    listen 8443 ssl;
    server_name 101.132.42.13;

    ssl_certificate     /etc/nginx/ssl/pgytcm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/pgytcm.com.key;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 600s;
    }
}
