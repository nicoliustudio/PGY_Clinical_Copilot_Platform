# 蒲公英中医 Clinical Copilot v1（X1）—— 域名 HTTPS 入口
# 与 v2.9 的分工：443 域名归 X1（→ 127.0.0.1:8002）；v2.9 退到 8443 仅 IP（pgy-v29.conf）。
#
# 部署：scp 到 /etc/nginx/conf.d/pgy-x1.conf 后 nginx -t && systemctl reload nginx

# 登录限流：公网域名 + 账号密码，必须挡住暴力破解（每 IP 每分钟 5 次，突发 10）
limit_req_zone $binary_remote_addr zone=pgy_x1_login:10m rate=5r/m;

server {
    listen 443 ssl;
    server_name www.pgytcm.com pgytcm.com;

    ssl_certificate     /etc/nginx/ssl/pgytcm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/pgytcm.com.key;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;        # ★ SSE 必须：不缓冲，否则前端进度条卡死
        proxy_cache off;            # ★ 流式响应不得缓存
        proxy_read_timeout 600s;    # ★ 长推理（LLM）不被 Nginx 掐断
    }

    location = /api/auth/login {
        limit_req zone=pgy_x1_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # ★ 二者缺一，WebSocket 握手 400
        proxy_set_header Connection "upgrade";       # ★
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 600s;                     # 语音流式会话不能中途被掐
    }
}

# 8443：备用 HTTPS，域名直连也能打开 X1（不依赖 443 是否放行）
# 注意：8443 上的 IP 入口留给 v2.9（pgy-v29.conf），此处只认域名，避免 server_name 冲突
server {
    listen 8443 ssl;
    server_name www.pgytcm.com pgytcm.com;

    ssl_certificate     /etc/nginx/ssl/pgytcm.com.pem;
    ssl_certificate_key /etc/nginx/ssl/pgytcm.com.key;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location = /api/auth/login {
        limit_req zone=pgy_x1_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 600s;
    }
}

# 80：域名只做 301 跳 HTTPS（避免用户输入无协议域名时落到默认站点）
server {
    listen 80;
    server_name www.pgytcm.com pgytcm.com;
    return 301 https://$host$request_uri;
}
